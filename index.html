<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hook Mixer — Junction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Hook <span>Mixer</span></h1>
      <p class="muted">Бере випадкове відео й випадковий хук із Google Drive і поєднує їх через ffmpeg прямо у браузері.</p>
    </header>

    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="drive" type="button">Google Drive</button>
        <button class="tab" data-mode="local" type="button">Файли з компʼютера</button>
      </div>

      <div id="drive-box">
        <label>Посилання на Apps Script (або Google API-ключ)
          <input id="apiKey" type="password" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
        </label>
        <label>Головна папка на Google Drive (посилання або ID)
          <input id="mainFolder" placeholder="https://drive.google.com/drive/folders/...">
        </label>
        <button id="loadDrive" class="btn ghost" type="button">Завантажити список файлів</button>
        <div id="pickers" class="row" hidden>
          <label>Папка з хуками
            <select id="hooksPick"></select>
          </label>
          <label>Папка з відео
            <select id="videosPick"></select>
          </label>
        </div>
      </div>

      <div id="local-box" hidden>
        <label>Відео-хуки (кліпи)
          <input id="localHookClips" type="file" accept="video/*" multiple>
        </label>
        <label>Основні відео
          <input id="localVideos" type="file" accept="video/*" multiple>
        </label>
      </div>

      <label>Текстові хуки вручну (кожен з нового рядка, необовʼязково)
        <textarea id="manualHooks" rows="3" placeholder="Ти досі не можеш говорити англійською?"></textarea>
      </label>

      <p id="pool" class="muted small">Файли ще не завантажені.</p>
    </section>

    <section class="card">
      <div class="row">
        <label>Відео в одному ролику
          <input id="count" type="number" min="1" max="10" value="1">
        </label>
        <label>Скільки роликів зробити
          <input id="batch" type="number" min="1" max="10" value="1">
        </label>
        <label>Тип хука
          <select id="hookMode">
            <option value="auto">Випадковий</option>
            <option value="clip">Тільки відео-хук</option>
            <option value="text">Тільки текстовий хук</option>
            <option value="both">Відео-хук + текст на ньому</option>
          </select>
        </label>
        <label>Якість
          <select id="quality">
            <option value="720">720×1280 (швидко)</option>
            <option value="1080">1080×1920 (повільніше)</option>
          </select>
        </label>
        <label>Макс. секунд хука
          <input id="hookSec" type="number" min="0" value="5" title="0 = весь хук">
        </label>
        <label>Макс. секунд з кожного відео
          <input id="maxSec" type="number" min="0" value="0" title="0 = все відео">
        </label>
      </div>
      <button id="mix" class="btn big" type="button">Поєднати</button>
      <div class="progress" hidden><div id="bar"></div></div>
      <p id="status" class="muted small"></p>
    </section>

    <section id="results"></section>

    <details class="card">
      <summary>Журнал ffmpeg</summary>
      <pre id="log"></pre>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
